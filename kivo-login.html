<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy950:#030A2C; --navy900:#0E1830; --navy800:#16213F; --navy700:#1E2E56;
    --surface:#FFFFFF; --ink900:#0E1830; --ink600:#5B6480; --ink400:#9AA1B9; --line:#E6E8F0;
    --gold:#1A58FE; --goldSoft:#E7EDFF; --goldDeep:#1440C4;
    --cyan:#34C6D9; --cyanSoft:rgba(52,198,217,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--navy950);
    color:var(--ink900);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
    position:relative;
    overflow-x:hidden;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .disp{font-family:'Outfit',sans-serif;}

  /* ---------- ambient backdrop ---------- */
  .bg-wash{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 50% at 14% 8%, rgba(227,169,62,.16), transparent 60%),
      radial-gradient(55% 45% at 88% 92%, rgba(52,198,217,.14), transparent 60%),
      var(--navy950);
  }
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(70% 70% at 50% 40%, #000 20%, transparent 78%);
  }

  /* ---------- shell ---------- */
  .shell{
    position:relative; z-index:1;
    width:100%; max-width:1160px;
    display:flex;
    background:var(--surface);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 40px 100px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
    min-height:700px;
  }

  /* ---------- left: auth ---------- */
  .auth{
    flex:0 0 44%;
    padding:56px 56px 44px;
    display:flex; flex-direction:column;
  }
  .brand{margin-bottom:38px;}
  .brand .logo-lockup{
    height:30px; width:auto; display:block;
  }
  .brand .tag{
    margin-top:10px; font-size:11px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--ink400); font-family:'JetBrains Mono',monospace; font-weight:600;
  }

  .tabs{
    display:flex; gap:6px; background:#F2F3F8; padding:5px; border-radius:12px;
    margin-bottom:34px; width:fit-content;
  }
  .tab{
    border:none; background:transparent; cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:13.5px;
    padding:9px 22px; border-radius:9px; color:var(--ink600);
    transition:background .18s, color .18s;
  }
  .tab.active{background:var(--navy900); color:#fff;}

  h1.headline{
    font-family:'Outfit',sans-serif; font-weight:700; font-size:29px;
    color:var(--ink900); line-height:1.2; margin-bottom:6px;
  }
  .sub{color:var(--ink600); font-size:13.5px; margin-bottom:26px;}

  .sso{
    display:flex; align-items:center; gap:11px;
    border:1px solid var(--line); background:#fff; border-radius:11px;
    padding:12px 16px; cursor:pointer; font-weight:700; font-size:13.5px;
    color:var(--ink900); width:100%; transition:border-color .15s, background .15s;
  }
  .sso:hover{border-color:var(--navy900); background:#FAFAFC;}
  .sso svg{flex-shrink:0;}

  .divider{
    display:flex; align-items:center; gap:12px; margin:24px 0;
    color:var(--ink400); font-size:11px; letter-spacing:1px; text-transform:uppercase;
    font-family:'JetBrains Mono',monospace;
  }
  .divider::before, .divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .field{margin-bottom:18px;}
  .field label{
    display:block; font-size:11.5px; font-weight:700; color:var(--ink600);
    letter-spacing:.3px; margin-bottom:7px; text-transform:uppercase;
    font-family:'JetBrains Mono',monospace;
  }
  .field-wrap{position:relative;}
  .field input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:14px; font-family:inherit; color:var(--ink900); background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{
    outline:none; border-color:var(--gold);
    box-shadow:0 0 0 4px var(--goldSoft);
  }
  .field input::placeholder{color:var(--ink400);}
  .eye{
    position:absolute; right:13px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; color:var(--ink400); padding:4px;
    display:flex;
  }
  .eye:hover{color:var(--ink600);}

  .plan-grid{display:flex; gap:8px;}
  .plan-pill{
    flex:1; position:relative; cursor:pointer; text-align:center;
    border:1.5px solid var(--line); border-radius:10px; padding:10px 6px 9px;
    display:flex; flex-direction:column; gap:2px; transition:border-color .15s, background .15s;
  }
  .plan-pill input{position:absolute; opacity:0; pointer-events:none;}
  .plan-pill .plan-name{font-size:12px; font-weight:700; color:var(--ink600);}
  .plan-pill .plan-price{font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; color:var(--ink900);}
  .plan-pill .plan-price i{font-style:normal; font-size:10px; color:var(--ink400); font-weight:500;}
  .plan-pill.active, .plan-pill:has(input:checked){
    border-color:var(--gold); background:var(--goldSoft);
  }
  .plan-pill.active .plan-name, .plan-pill:has(input:checked) .plan-name{color:var(--goldDeep);}

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin:6px 0 26px; font-size:13px;
  }
  .remember{display:flex; align-items:center; gap:8px; color:var(--ink600); cursor:pointer;}
  .remember input{width:15px; height:15px; accent-color:var(--navy900); cursor:pointer;}
  .forgot{color:var(--ink600); text-decoration:none; font-weight:600;}
  .forgot:hover{color:var(--navy900);}

  .btn-primary{
    width:100%; padding:15px; border:none; border-radius:11px; cursor:pointer;
    background:var(--navy900); color:#fff; font-weight:700; font-size:14.5px;
    font-family:'Plus Jakarta Sans',sans-serif; letter-spacing:.2px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    transition:background .15s, transform .1s;
  }
  .btn-primary:hover{background:#060D1D;}
  .btn-primary:active{transform:scale(.99);}

  .footnote{
    margin-top:auto; padding-top:26px; text-align:center;
    font-size:12.5px; color:var(--ink400);
  }
  .footnote a{color:var(--ink900); font-weight:700; text-decoration:none;}

  /* ---------- right: signature panel ---------- */
  .stage{
    flex:1;
    position:relative;
    background:
      radial-gradient(120% 90% at 20% 0%, #1B2A52 0%, var(--navy900) 46%, var(--navy950) 100%);
    overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:34px 36px 40px;
  }
  .stage::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:38px 38px;
    mask-image:radial-gradient(85% 70% at 60% 40%, #000 10%, transparent 75%);
    pointer-events:none;
  }

  .stage-mark{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:9px;
  }
  .stage-mark img{height:22px; width:auto; filter:brightness(0) invert(1);}
  .stage-mark span{
    font-family:'Outfit',sans-serif; font-weight:700; font-size:15px;
    letter-spacing:1.5px; color:rgba(255,255,255,.85);
  }

  /* network / lead-flow visual */
  .flow-wrap{
    position:relative; z-index:2; flex:1;
    display:flex; align-items:center; justify-content:center;
    margin:10px 0;
  }
  .flow-wrap svg{width:100%; height:auto; max-width:520px;}
  .hub-glow{animation:hubpulse 2.6s ease-in-out infinite;}
  @keyframes hubpulse{
    0%,100%{ r:15; opacity:.9; }
    50%{ r:19; opacity:.55; }
  }

  .stage-copy{position:relative; z-index:2;}
  .stage-copy .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:10px;
  }
  .stage-copy h2{
    font-family:'Outfit',sans-serif; font-weight:700; font-size:30px; color:#fff;
    line-height:1.18; max-width:420px;
  }
  .stage-copy p{
    margin-top:12px; font-size:13.5px; color:rgba(255,255,255,.55); max-width:360px; line-height:1.6;
  }

  .stage-foot{
    position:relative; z-index:2; margin-top:26px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .dots{display:flex; gap:7px;}
  .dots span{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.25);}
  .dots span.on{background:var(--gold); width:20px; border-radius:4px;}
  .arrows{display:flex; gap:8px;}
  .arrows button{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05); color:#fff; cursor:pointer;

    <form id="authForm">
      <div class="field" id="usernameField" style="display:none;">
        <label>Username</label>
        <div class="field-wrap">
          <input type="text" placeholder="Choose a username" autocomplete="off" />
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <div class="field-wrap">
          <input id="email" type="email" placeholder="you@company.com" autocomplete="off" />
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="field-wrap">
          <input id="pw" type="password" placeholder="Enter your password" autocomplete="off" />
          <button type="button" class="eye" onclick="togglePw()">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="field" id="subscriptionField" style="display:none;">
        <label>Subscription</label>
        <div class="plan-grid">
          <label class="plan-pill">
            <input type="radio" name="plan" value="starter" />
            <span class="plan-name">Starter</span>
            <span class="plan-price">$29<i>/mo</i></span>
          </label>
          <label class="plan-pill active">
            <input type="radio" name="plan" value="growth" checked />
            <span class="plan-name">Growth</span>
            <span class="plan-price">$79<i>/mo</i></span>
          </label>
          <label class="plan-pill">
            <input type="radio" name="plan" value="agency" />
            <span class="plan-name">Agency</span>
            <span class="plan-price">$199<i>/mo</i></span>
          </label>
        </div>
      </div>

      <div class="row-between">
        <label class="remember"><input type="checkbox" checked/> Keep me signed in</label>
        <a class="forgot" href="#">Forgot password?</a>
      </div>

      <div id="authError" style="display:none; color:#FF6B6B; font-size:12.5px; margin-bottom:12px;"></div>

      <button class="btn-primary" type="submit" id="submitBtn">
        Enter Console

      </button>
    </form>

    <div class="flow-wrap">
      <svg viewBox="0 0 520 300" fill="none">
        <!-- flow paths: sources (leads) converging into hub, then out to agents -->
        <path id="p1" d="M10,40 C140,40 160,150 250,150" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
        <path id="p2" d="M10,150 C120,150 160,150 250,150" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
        <path id="p3" d="M10,260 C140,260 160,150 250,150" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
        <path id="p4" d="M250,150 C340,150 360,60 500,50" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
        <path id="p5" d="M250,150 C340,150 380,150 500,150" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>
        <path id="p6" d="M250,150 C340,150 360,240 500,255" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>

        <!-- source nodes (lead origins) -->
        <circle cx="10" cy="40" r="4" fill="var(--gold)"/>
        <circle cx="10" cy="150" r="4" fill="var(--gold)"/>
        <circle cx="10" cy="260" r="4" fill="var(--gold)"/>

        <!-- agent nodes -->
        <circle cx="500" cy="50" r="4" fill="var(--cyan)"/>
        <circle cx="500" cy="150" r="4" fill="var(--cyan)"/>
        <circle cx="500" cy="255" r="4" fill="var(--cyan)"/>

        <!-- hub -->
        <circle cx="250" cy="150" r="15" fill="rgba(227,169,62,.15)" class="hub-glow"/>
        <circle cx="250" cy="150" r="15" fill="var(--navy900)" stroke="var(--gold)" stroke-width="2"/>
        <circle cx="250" cy="150" r="4.5" fill="var(--gold)"/>

        <!-- animated dots traveling along each path -->
        <circle r="3.2" fill="#fff"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
        <circle r="3.2" fill="#fff"><animateMotion dur="2.6s" repeatCount="indefinite" begin=".8s"><mpath href="#p2"/></animateMotion></circle>
        <circle r="3.2" fill="#fff"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.6s"><mpath href="#p3"/></animateMotion></circle>

        <circle r="3.2" fill="var(--cyan)"><animateMotion dur="2.6s" repeatCount="indefinite" begin=".3s"><mpath href="#p4"/></animateMotion></circle>

        <button aria-label="next">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>

<script>
  function togglePw(){
    const pw = document.getElementById('pw');
    const icon = document.getElementById('eyeIcon');
    if(pw.type === 'password'){
      pw.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a20.3 20.3 0 0 1 4.22-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>';
    } else {
      pw.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  function setMode(mode){
    const isLogin = mode === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabSignup').classList.toggle('active', !isLogin);
    document.getElementById('headline').textContent = isLogin ? 'Welcome back' : 'Join the console';
    document.getElementById('subline').textContent = isLogin
      ? 'Sign in to pick up where your pipeline left off.'
      : 'Create your account and pick a plan to start routing leads.';
    document.querySelector('.btn-primary').firstChild.textContent = isLogin ? 'Enter Console ' : 'Create Account ';
    document.getElementById('footnote').innerHTML = isLogin
      ? 'New to the team? <a href="#" onclick="setMode(\'signup\');return false;">Request an account</a>'
      : 'Already have an account? <a href="#" onclick="setMode(\'login\');return false;">Log in</a>';
    document.getElementById('usernameField').style.display = isLogin ? 'none' : 'block';
    document.getElementById('subscriptionField').style.display = isLogin ? 'none' : 'block';
  }

  document.querySelectorAll('.plan-pill').forEach(function(pill){
    pill.addEventListener('click', function(){
      document.querySelectorAll('.plan-pill').forEach(function(p){ p.classList.remove('active'); });
      pill.classList.add('active');
      pill.querySelector('input').checked = true;
    });
  });

  // ---------- Supabase Auth ----------
  const SUPABASE_URL = "https://yqxcskfhqfxmpxbwsecv.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxeGNza2ZocWZ4bXB4YndzZWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODI2OTEsImV4cCI6MjEwMTc1ODY5MX0.Qo4x-C2MEIkuN2yjcyyz85-3e8Zf_vkqaCiWckAs0cI";

  // already logged in? skip straight to the console
  if(localStorage.getItem('kivo_session')){
    window.location.href = 'kivo-crm.html';
  }

  document.getElementById('authForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const isSignup = document.getElementById('tabSignup').classList.contains('active');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pw').value;
    const errEl = document.getElementById('authError');
    const btn = document.getElementById('submitBtn');
    errEl.style.display = 'none';

    if(!email || !password){
      errEl.textContent = 'Enter both email and password.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    const originalText = btn.innerHTML;
    btn.innerHTML = 'Please wait…';

    try{
      const endpoint = isSignup ? 'signup' : 'token?grant_type=password';
      const res = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(!res.ok){
        throw new Error(data.msg || data.error_description || data.error || 'Something went wrong.');
      }
      if(data.access_token){
        localStorage.setItem('kivo_session', JSON.stringify({
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          email
        }));
        window.location.href = 'kivo-crm.html';
      } else if(isSignup){
        errEl.style.color = '#34C6D9';
        errEl.textContent = 'Account created — check your email to confirm, then log in.';
        errEl.style.display = 'block';
        setMode('login');
      }
    }catch(err){
      errEl.style.color = '#FF6B6B';
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  });
</script>
