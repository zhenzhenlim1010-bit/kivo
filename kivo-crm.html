<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kivo — Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy950:#030A2C; --navy900:#0E1830; --navy800:#16213F; --navy700:#1E2E56;
    --ink600:#8A93B4; --ink400:#5E6893; --line:rgba(255,255,255,.09);
    --blue:#1A58FE; --blueSoft:rgba(26,88,254,.14); --blueDeep:#1440C4;
    --cyan:#34C6D9; --cyanSoft:rgba(52,198,217,.14);
    --white:#F5F7FF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--navy950); color:var(--white);
    min-height:100vh;
  }
  .bg-wash{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(50% 40% at 82% 0%, rgba(26,88,254,.22), transparent 62%),
      radial-gradient(45% 35% at 10% 60%, rgba(52,198,217,.08), transparent 65%),
      var(--navy950);
  }
  nav{
    position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:20px 40px; max-width:1400px; margin:0 auto;
  }
  nav .logo-lockup{height:22px;}
  .nav-tabs{display:flex; gap:8px; background:var(--navy900); border:1px solid var(--line); border-radius:12px; padding:5px;}
  .nav-tabs button{
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:13.5px;
    padding:9px 20px; border-radius:9px; border:none; background:transparent; color:var(--ink600); cursor:pointer;
  }
  .nav-tabs button.active{background:var(--blue); color:#fff;}
  .btn-primary{
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:13.5px;
    color:#fff; background:var(--blue); border:none; border-radius:10px;
    padding:11px 18px; cursor:pointer;
  }
  .btn-primary:hover{background:var(--blueDeep);}

  main{position:relative; z-index:2; max-width:1400px; margin:0 auto; padding:24px 40px 80px;}
  .page-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;}
  .page-head h1{font-family:'Outfit',sans-serif; font-weight:700; font-size:26px;}
  .page-head p{color:var(--ink600); font-size:13.5px; margin-top:4px;}

  /* pipeline board */
  #pipelineView{display:flex; gap:16px; overflow-x:auto; padding-bottom:20px;}
  .stage-col{flex:0 0 260px; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:16px; padding:14px;}
  .stage-col h3{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink600); margin-bottom:12px; display:flex; justify-content:space-between;}
  .stage-col h3 .count{color:var(--cyan);}
  .lead-card{
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;
  }
  .lead-card .name{font-family:'Outfit',sans-serif; font-weight:700; font-size:14.5px; margin-bottom:4px;}
  .lead-card .prop{font-size:12px; color:var(--cyan); margin-bottom:8px;}
  .lead-card .meta{font-size:11.5px; color:var(--ink600); margin-bottom:10px;}
  .lead-card select{
    width:100%; background:var(--navy900); border:1px solid var(--line); border-radius:8px;
    color:var(--white); font-size:11.5px; padding:7px; font-family:'Plus Jakarta Sans',sans-serif;
  }
  .empty-col{font-size:12px; color:var(--ink400); padding:20px 0; text-align:center;}

  /* contacts table */
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink600); padding:10px 14px; border-bottom:1px solid var(--line);}
  td{padding:14px; border-bottom:1px solid var(--line); font-size:13.5px;}
  td.sub{color:var(--ink600); font-size:12px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:10.5px; background:var(--cyanSoft); color:var(--cyan); padding:3px 9px; border-radius:100px; border:1px solid rgba(52,198,217,.3);}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(3,10,44,.7); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:20;}
  .overlay.show{display:flex;}
  .modal{background:var(--navy900); border:1px solid var(--line); border-radius:18px; padding:28px; width:420px; max-width:92vw;}
  .modal h3{font-family:'Outfit',sans-serif; font-size:18px; margin-bottom:18px;}
  .modal label{font-size:12px; color:var(--ink600); display:block; margin:12px 0 6px;}
  .modal input, .modal select{
    width:100%; background:var(--navy800); border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; color:var(--white); font-size:13.5px; font-family:'Plus Jakarta Sans',sans-serif;
  }
  .modal-actions{display:flex; gap:10px; margin-top:22px; justify-content:flex-end;}
  .btn-ghost2{background:transparent; border:1px solid var(--line); color:var(--white); border-radius:9px; padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer;}

  .status-msg{font-size:12.5px; color:var(--ink600); font-family:'JetBrains Mono',monospace; margin-bottom:16px;}
</style>
</head>

<script>
const SUPABASE_URL = "https://yqxcskfhqfxmpxbwsecv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxeGNza2ZocWZ4bXB4YndzZWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODI2OTEsImV4cCI6MjEwMTc1ODY5MX0.Qo4x-C2MEIkuN2yjcyyz85-3e8Zf_vkqaCiWckAs0cI";

// ---- require login ----
const sessionRaw = localStorage.getItem('kivo_session');
if(!sessionRaw){
  window.location.href = 'kivo-login.html';
}
const session = sessionRaw ? JSON.parse(sessionRaw) : null;
if(session?.email){
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('userEmail').textContent = session.email;
  });
}
function logout(){
  localStorage.removeItem('kivo_session');
  window.location.href = 'kivo-login.html';
}

const STAGES = ["Enquiry","Viewing","Offer","Booking","SPA","Loan Approval","Completed"];

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${session?.access_token || SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.method === "POST" || opts.method === "PATCH" ? "return=representation" : undefined,
      ...(opts.headers||{})
    }
  });
  if(res.status === 401){
    logout();
    return;
  }
  if(!res.ok){
    const txt = await res.text();
    throw new Error(`${res.status}: ${txt}`);
  }
  return res.status === 204 ? null : res.json();
}

let contacts = [], properties = [], agents = [], leads = [];

async function loadAll(){
  const statusEl = document.getElementById('statusMsg');
  try{
    [contacts, properties, agents, leads] = await Promise.all([
      sb('contacts?select=*&order=created_at.desc'),
      sb('properties?select=*&order=created_at.desc'),
      sb('agents?select=*'),
      sb('leads?select=*,contacts(name),properties(title),agents(name)&order=created_at.desc')
    ]);
    statusEl.textContent = `Connected — ${contacts.length} contacts, ${leads.length} leads`;
    renderPipeline();
    renderContacts();
    populateSelects();
  }catch(e){
    statusEl.textContent = "Couldn't load from Supabase: " + e.message + " — check the tables exist and RLS policies were applied.";
  }
}

function renderPipeline(){
  const el = document.getElementById('pipelineView');
  el.innerHTML = STAGES.map(stage => {
    const items = leads.filter(l => l.stage === stage);
    return `<div class="stage-col">
      <h3>${stage} <span class="count">${items.length}</span></h3>
      ${items.length ? items.map(cardHtml).join('') : '<div class="empty-col">No leads</div>'}
    </div>`;
  }).join('');
}

function cardHtml(l){
  return `<div class="lead-card">
    <div class="name">${l.contacts?.name || 'Unnamed'}</div>
    ${l.properties?.title ? `<div class="prop">${l.properties.title}</div>` : ''}
    <div class="meta">${l.agents?.name ? 'Agent: '+l.agents.name : 'Unassigned'}</div>
    <select onchange="moveStage('${l.id}', this.value)">
      ${STAGES.map(s => `<option value="${s}" ${s===l.stage?'selected':''}>${s}</option>`).join('')}
    </select>
  </div>`;
}

async function moveStage(leadId, newStage){
  await sb(`leads?id=eq.${leadId}`, { method:'PATCH', body: JSON.stringify({ stage: newStage, updated_at: new Date().toISOString() }) });
  await loadAll();
}

function renderContacts(){
  document.getElementById('contactsTbody').innerHTML = contacts.map(c => `
    <tr>
      <td>${c.name}</td>
      <td class="sub">${c.phone || '—'}</td>
      <td class="sub">${c.email || '—'}</td>
      <td>${c.source ? `<span class="tag">${c.source}</span>` : '—'}</td>
    </tr>`).join('');
}

function populateSelects(){
  document.getElementById('leadContact').innerHTML = contacts.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('leadProperty').innerHTML = '<option value="">— none —</option>' + properties.map(p => `<option value="${p.id}">${p.title}</option>`).join('');
  document.getElementById('leadAgent').innerHTML = '<option value="">— unassigned —</option>' + agents.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
}

function switchView(view){
  document.getElementById('pipelinePage').style.display = view==='pipeline' ? 'block' : 'none';
  document.getElementById('contactsPage').style.display = view==='contacts' ? 'block' : 'none';
  document.getElementById('tabPipeline').classList.toggle('active', view==='pipeline');
  document.getElementById('tabContacts').classList.toggle('active', view==='contacts');
}

function openModal(){ document.getElementById('leadOverlay').classList.add('show'); }
function closeModal(){ document.getElementById('leadOverlay').classList.remove('show'); }
function openContactModal(){ document.getElementById('contactOverlay').classList.add('show'); }
function closeContactModal(){ document.getElementById('contactOverlay').classList.remove('show'); }

async function createLead(){
  const contact_id = document.getElementById('leadContact').value;
  if(!contact_id){ alert('Add a contact first.'); return; }
  const property_id = document.getElementById('leadProperty').value || null;
  const agent_id = document.getElementById('leadAgent').value || null;
  const stage = document.getElementById('leadStage').value;
  await sb('leads', { method:'POST', body: JSON.stringify({ contact_id, property_id, agent_id, stage }) });
  closeModal();
  await loadAll();
}

async function createContact(){
  const name = document.getElementById('cName').value.trim();
  if(!name){ alert('Name is required.'); return; }
  const body = {
    name,
    phone: document.getElementById('cPhone').value || null,
    email: document.getElementById('cEmail').value || null,
    source: document.getElementById('cSource').value || null
  };
  await sb('contacts', { method:'POST', body: JSON.stringify(body) });
  ['cName','cPhone','cEmail','cSource'].forEach(id => document.getElementById(id).value = '');
  closeContactModal();
  await loadAll();
}

loadAll();
</script>
</body>
</html>
